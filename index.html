<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POC delivery roadmap</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d0f; color: #f7f8fa; padding: 16px; }
    .toolbar { max-width: 1920px; margin: 0 auto 12px; display: flex; justify-content: flex-end; }
    .export-button { appearance: none; border: 1px solid #3c4652; border-radius: 8px; background: #171c21; color: #f7f8fa; font: inherit; font-weight: 600; padding: 9px 14px; cursor: pointer; }
    .export-button:hover { background: #222a31; }
    .export-button:focus-visible { outline: 2px solid #83b7ff; outline-offset: 2px; }
    .roadmap-shell { max-width: 1920px; margin: 0 auto; overflow-x: auto; }
    #roadmap-svg { display: block; width: 100%; min-width: 1110px; height: auto; }
    .error { max-width: 1920px; margin: 0 auto; color: #ffaaaa; }
    @media print { body { padding: 0; } .toolbar { display: none; } .roadmap-shell { overflow: visible; } #roadmap-svg { min-width: 0; } }
  </style>
  <script src="./roadmap.js" defer></script>
</head>
<body>
  <div class="toolbar">
    <button id="export-svg" class="export-button" type="button" disabled>Export SVG</button>
  </div>
  <main class="roadmap-shell" aria-label="POC delivery roadmap">
    <svg id="roadmap-svg" role="img" aria-labelledby="roadmap-title roadmap-desc"></svg>
  </main>
  <p id="error" class="error" hidden></p>
</body>
</html>
